<section class="p3-page">
    <div class="mb-4"><h1>Projekt 3 — PyGAD</h1><p class="text-muted">Optymalizacja funkcji kwadratowej dla reprezentacji binarnej i rzeczywistej.</p></div>
    <form id="p3-form" class="card card-body mb-4">
        <div class="row g-3">
            <div class="col-md-3"><label class="form-label" for="p3-representation">Reprezentacja</label><select id="p3-representation" class="form-select"><option value="binary">Binarna</option><option value="real">Rzeczywista</option></select></div>
            <div class="col-md-2"><label class="form-label" for="p3-dimensions">Zmienne</label><input id="p3-dimensions" class="form-control" type="number" min="1" value="2"></div>
            <div class="col-md-2"><label class="form-label" for="p3-genes">Liczba genów</label><input id="p3-genes" class="form-control" type="number" min="1" value="60"></div>
            <div class="col-md-2"><label class="form-label" for="p3-generations">Pokolenia</label><input id="p3-generations" class="form-control" type="number" min="1" value="100"></div>
            <div class="col-md-3"><label class="form-label" for="p3-population">Populacja</label><input id="p3-population" class="form-control" type="number" min="2" value="40"></div>
            <div class="col-md-3"><label class="form-label" for="p3-selection">Selekcja</label><select id="p3-selection" class="form-select"><option value="tournament">Turniejowa</option><option value="rws">Koło ruletki (RWS)</option><option value="random">Losowa</option></select></div>
            <div class="col-md-3"><label class="form-label" for="p3-crossover">Krzyżowanie</label><select id="p3-crossover" class="form-select"><option value="single_point">Jednopunktowe</option><option value="two_points">Dwupunktowe</option><option value="uniform">Jednorodne</option></select></div>
            <div class="col-md-3"><label class="form-label" for="p3-function">Funkcja</label><select id="p3-function" class="form-select"><option value="quadratic">Kwadratowa</option><option value="hyperellipsoid">Hyperellipsoid</option><option value="ackley01">Ackley 01</option><option value="cec2014_f3">CEC 2014 F3</option></select></div>
            <div class="col-md-3"><label class="form-label" for="p3-mutation">Mutacja</label><select id="p3-mutation" class="form-select"><option value="random">Losowa</option><option value="swap">Zamiana indeksów</option><option value="gaussian">Gaussa</option></select></div>
            <div class="col-md-3"><label class="form-label" for="p3-repetitions">Powtórzenia</label><input id="p3-repetitions" class="form-control" type="number" min="1" max="100" value="10"></div>
            <div class="col-md-3 d-none" id="p3-lower-bound-field"><label class="form-label" for="p3-lower-bound">Dolna granica</label><input id="p3-lower-bound" class="form-control" type="number" step="any" value="-35"></div>
            <div class="col-md-3 d-none" id="p3-upper-bound-field"><label class="form-label" for="p3-upper-bound">Górna granica</label><input id="p3-upper-bound" class="form-control" type="number" step="any" value="35"></div>
        </div>
        <div class="mt-3"><button class="btn btn-primary" type="submit">Uruchom eksperyment</button><span id="p3-status" class="ms-3 text-muted"></span></div>
    </form>
    <div id="p3-result"></div>
</section>
